lang: en
statement:
  aliases: false
  kinds:
    theorem:
      label: 定理
      counter: self
      style: plain
    lemma:
      label: 引理
      counter: theorem
      style: plain
    definition:
      label: 定义
      counter: theorem
      style: definition
    proof:
      label: 证明
      counter: none
      style: proof
    remark:
      label: 备注
      counter: theorem
      style: remark
    example:
      label: 例
      counter: theorem
      style: definition
    proposition:
      label: 命题
      counter: theorem
      style: plain
    corollary:
      label: 推论
      counter: theorem
      style: plain
